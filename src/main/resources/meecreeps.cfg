general {
    # Autoclose Timer [20 ticks = 1 second]
    I:portalTimeout=300

    # Autoclose Timer After Entry [20 ticks = 1 second]
    I:portalTimeoutAfterEntry=50

    # Maximum Interdimensional Cartridge Charge
    I:intradimensionalMaxCharge=50

    # Intradimensional Cartridge Single-Refill Amount
    I:intradimensionalRefillAmount=50

    # Maximum Interdimensional Cartridge Charge
    I:interdimensionalMaxCharge=100

    # Interdimensional Cartridge Single-Refill Amount
    I:interdimensionalRefillAmount=100

    # Maximum Extradimensional Cartridge Charge
    I:extradimensionalMaxCharge=200

    # Extradimensional Cartridge Single-Refill Amount
    I:extradimensionalRefillAmount=200

    # Maximum Hyperdimensional Cartridge Charge
    I:hyperdimensionalMaxCharge=400

    # Hyperdimensional Cartridge Single-Refill Amount
    I:hyperdimensionalRefillAmount=400

    # Maximum number of uses for a single MeeCreep box (-1 means unlimited)
    I:meeCreepBoxMaxUsage=-1

    # Maximum MeeCreeps Per Player (-1 = Unlimited)
    I:maxMeecreepsPerPlayer=4

    # Volume of MeeCreeps [range: 0.0 ~ 1.0]
    D:meeCreepVolume=1.0

    # Volume of Portal Guns [range: 0.0 ~ 1.0]
    D:teleportVolume=1.0

    # Balloon horizontal postion: 0 means centered, positive means percentage offset from left side, negative means percentage offset from right side
    I:messageX=0

    # Balloon vertical position: 0 means centered, positive means percentage offset from top side, negative means percentage offset from bottom side
    I:messageY=10

    # Number of ticks (20 ticks per second) before the balloon message disappears
    I:messageTimeout=60

    # Spawn cap for an angry MeeCreep (a MeeCreep with a box)
    I:maxSpawnCount=60

    # Maximum number of tree blocks a single MeeCreep can chop down
    I:maxTreeBlocks=2000

    # Delay harvest of blocks if hardness is bigger then this value
    D:delayAtHardness=10.0

    # Speed modifier for harvesting (i.e. how much faster a MeeCreep is compared to a player)
    D:delayFactor=0.75
}

# Permission configuration
permission {
    B:allowed_meecreeps.make_house=true
    B:allowed_meecreeps.make_platform=true
    B:allowed_meecreeps.flatten_area=true
    B:allowed_meecreeps.chop_tree=true
    B:allowed_meecreeps.chop_tree_collect=true
    B:allowed_meecreeps.dig_down=true
    B:allowed_meecreeps.dig_down_stairs=true
    B:allowed_meecreeps.mine_ores=true
    B:allowed_meecreeps.dig_tunnel=true
    B:allowed_meecreeps.harvest_replant=true
    B:allowed_meecreeps.harvest=true
    B:allowed_meecreeps.torches=true
    B:allowed_meecreeps.follow_and_lightup=true
    B:allowed_meecreeps.pickup=true
    B:allowed_meecreeps.follow_and_pickup=true
    B:allowed_meecreeps.move_stuff=true
    B:allowed_meecreeps.idle=true
    B:allowed_meecreeps.angry=false
}

dimensions {
    # Dimensions blacklisted from Portal Travel.
    I:DimensionBlacklist <

    >

    # Enable Galaxy Space Support
    B:EnableGalaxySpaceSupport=false

    # Enable GalactiCraft Support
    B:EnableGalactiCraftSupport=false

    # Enable Galaxy Space Support
    B:EnableGalatiCraftSpaceStationSupport=false

    # Default Space Group ID
    I:DefaultSpaceGroupID=0
}

dimension_groups {

