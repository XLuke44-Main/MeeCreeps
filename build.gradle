buildscript {
    repositories {
        jcenter()

        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }

        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }

    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

plugins {
    id 'com.matthewprenger.cursegradle' version '1.1.0'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'maven'


repositories {
    /*
     * Local Maven repository containing the old Minecraft mod
     * dependencies. This is used instead of the dead/unstable
     * remote Maven repositories from the original project.
     */
    maven {
        name = "LocalMods"
        url = uri("$rootDir/local-maven")
    }

    /*
     * Forge/Minecraft dependencies.
     */
    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net/"
    }

    maven {
        name = "Sonatype"
        url = "https://oss.sonatype.org/content/repositories/snapshots/"
    }
}


def ENV = System.getenv()

if (ENV.DRONE_BUILD_NUMBER) {
    version += ".n" + ENV.DRONE_BUILD_NUMBER
}

group = "com.github.mcjty"
archivesBaseName = "meecreeps"


sourceCompatibility = 1.8
targetCompatibility = 1.8


minecraft {
    ext.version = "${minecraft_version}-${forge_version}"
    mappings channel: 'snapshot', version: mcp_mappings

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}


task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    classifier = 'sources'
}


task deobfJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'dev'
}


artifacts {
    archives sourceJar
    archives deobfJar
}

jar.finalizedBy('reobfJar')


/*
 * Dependencies.
 *
 * These remain Maven-style dependencies and are deobfuscated by
 * ForgeGradle 3 before compilation.
 *
 * The coordinates are provided by ./local-maven rather than the
 * original remote repositories.
 */
dependencies {

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("mezz.jei:jei_1.12.2:${jei_version}")

    implementation fg.deobf("mcp.mobius.waila:Hwyla:${waila_version}")

    implementation fg.deobf("mcjty.theoneprobe:TheOneProbe-1.12:${top_version}")

    implementation fg.deobf("cofh:RedstoneFlux:${redstoneflux_version}")

    implementation fg.deobf("com.github.mcjty:intwheel:${intwheel_version}")

    if (!project.hasProperty("singleproject")) {
        implementation fg.deobf("com.github.mcjty:mcjtylib:${mcjtylib_version}")
    } else {
        implementation project(':McJtyLib')
    }
}


processResources
{
    /*
     * This will ensure that this task is redone when the versions change.
     */
    inputs.property "version", project.version
    inputs.property "mcversion", minecraft_version

    /*
     * Replace stuff in mcmod.info, nothing else.
     */
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        /*
         * Replace version and mcversion.
         */
        expand 'version': project.version, 'mcversion': minecraft_version
    }

    /*
     * Copy everything else that isn't mcmod.info.
     */
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}


task("uploadJars", dependsOn: "reobfJar") {
    description = "uploads JARs"

    if (System.getenv("local_maven") != null) {

        apply plugin: 'maven'

        uploadArchives {
            repositories {
                mavenDeployer {

                    repository(
                        url: "file://" + System.getenv("local_maven")
                    )

                    pom {

                        groupId = project.group
                        version = project.version
                        artifactId = project.archivesBaseName

                        project {

                            name project.archivesBaseName
                            packaging 'jar'
                            description "XLuke44's MeeCreeps"

                            scm {
                                url 'https://github.com/XLuke44-Main/MeeCreeps'
                                connection 'scm:git:git@github.com:XLuke44-Main/MeeCreeps.git'
                                developerConnection 'scm:git:git@github.com:XLuke44-Main/MeeCreeps.git'
                            }

                            issueManagement {
                                system 'github'
                                url 'https://github.com/XLuke44-Main/MeeCreeps/issues'
                            }

                            licenses {
                                license {
                                    name 'MIT'
                                    distribution 'repo'
                                }
                            }

                            developers {
                                developer {
                                    id 'XLuke44'
                                    name 'XLuke44'
                                    roles {
                                        role 'developer'
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

String getChangelogText() {
    def changelogFile = file('changelog.txt')
    String str = ''
    int lineCount = 0
    boolean done = false
    changelogFile.eachLine {
        if (done || it == null) {
            return
        }
        if (it.size() > 1) {
            def temp = it
            if (lineCount == 0) {
                temp = "${modname} ${version}"
                temp = "<h2>$temp</h2>"
            } else if (it.startsWith('-')) {
                temp = "&nbsp;&nbsp;&nbsp;$temp"
                temp = temp.replaceAll("(\\S+\\/\\S+)#([0-9]+)\\b", "<a href=\"https://github.com/\$1/issues/\$2\">\$0</a>")
                temp = temp.replaceAll("#([0-9]+)\\b(?!<\\/a>)", "<a href=\"https://github.com/$github_project/issues/\$1\">\$0</a>")
            } else {
                temp = "<h4>$temp</h4>"
            }
            str += "$temp<br/>"
            lineCount++
            return
        } else {
            done = true
        }
    }
    return str
}


tasks.curseforge.enabled = project.hasProperty('curseforge_key')


curseforge {

    if (project.hasProperty('curseforge_key')) {
        apiKey = project.curseforge_key
    }

    project {

        id = project.projectId

        changelog =
            System.getenv('CHANGELOG') == null ||
            System.getenv('CHANGELOG').equals('none')
                ? getChangelogText()
                : System.getenv('CHANGELOG')

        changelogType = 'html'
        releaseType = project.curse_type

        addGameVersion '1.12.2'

        mainArtifact(jar) {
            displayName = "${modname} - ${version}"
        }

        relations {
            requiredLibrary 'mcjtylib'
            optionalLibrary 'the-one-probe'
        }
    }
}
